name: Run DriveZip Cloud Backend

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Minutes to keep cloud server running (max 350)'
        required: false
        default: '300'

concurrency:
  group: drivezip-cloud-backend
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cloud-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fast Install Python Venv & Cloudflared
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          python3 -m venv venv
          ./venv/bin/pip install -q fastapi uvicorn httpx pydantic
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start FastAPI & Force-Publish New Tunnel URL
        run: |
          touch backend/__init__.py
          PYTHONPATH=. nohup ./venv/bin/uvicorn backend.app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "FastAPI verified online on port 8000!"
              break
            fi
            sleep 1
          done
          cat server.log
          rm -f tunnel.log
          nohup ./cloudflared tunnel --url http://127.0.0.1:8000 --logfile tunnel.log > /dev/null 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            sleep 1
            if [ -f tunnel.log ]; then
              URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | tail -n 1 || true)
              if [ -n "$URL" ]; then
                break
              fi
            fi
          done
          echo "NEW LIVE URL: $URL"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            echo -n "$URL" > live_url.txt
            git add live_url.txt
            git commit -m "Update live backend tunnel URL ($URL) [skip ci]" || true
            if git push origin HEAD:main; then
              echo "Successfully pushed new live_url.txt!"
              break
            fi
            sleep 2
          done

      - name: Keep Server Alive
        run: |
          MINS="${{ github.event.inputs.duration_minutes || '300' }}"
          echo "Server running for $MINS minutes..."
          sleep $((MINS * 60))
