name: Build DriveZip APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'live_url.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository (Node 24 Native)
        uses: actions/checkout@v6

      - name: Load or Create Persistent Keystore (Permanent SHA-1)
        run: |
          mkdir -p ~/.android
          if [ -f keystore.b64 ]; then
            echo "Restoring permanent debug.keystore from keystore.b64..."
            tr -d '\n\r ' < keystore.b64 | base64 -d > ~/.android/debug.keystore
          else
            echo "Generating new permanent debug.keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w 0 ~/.android/debug.keystore > keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore.b64
            git commit -m "Save permanent debug keystore [skip ci]" || true
            git push origin HEAD:main || true
          fi
          cp ~/.android/debug.keystore debug.keystore
          mkdir -p app
          cp ~/.android/debug.keystore app/debug.keystore

      - name: Install Gradle 8.7 & Build Debug APK (Zero Action Warnings)
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          if [ ! -d "/opt/gradle-8.7" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          /opt/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact (Node 24 Native)
        uses: actions/upload-artifact@v7
        with:
          name: DriveZip-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
