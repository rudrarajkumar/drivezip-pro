name: Build DriveZip APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'live_url.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Load or Create Persistent Keystore (Permanent SHA-1)
        run: |
          mkdir -p ~/.android
          if [ -f keystore.b64 ]; then
            echo "Restoring permanent debug.keystore from keystore.b64..."
            tr -d '\n\r ' < keystore.b64 | base64 -d > ~/.android/debug.keystore
          else
            echo "Generating new permanent debug.keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w 0 ~/.android/debug.keystore > keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore.b64
            git commit -m "Save permanent debug keystore [skip ci]" || true
            git push origin HEAD:main || true
          fi
          cp ~/.android/debug.keystore debug.keystore
          mkdir -p app
          cp ~/.android/debug.keystore app/debug.keystore

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveZip-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
