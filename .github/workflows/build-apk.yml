name: Build DriveZip APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'live_url.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Load or Create Persistent Keystore (Permanent SHA-1)
        run: |
          mkdir -p ~/.android
          if [ -f "keystore.b64" ]; then
            base64 -d keystore.b64 > ~/.android/debug.keystore
          else
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DriveZip, OU=Personal, O=DriveZip, L=Imphal, S=MN, C=IN"
            base64 -w 0 ~/.android/debug.keystore > keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore.b64
            git commit -m "Lock permanent Android signing keystore [skip ci]" || true
            git push origin HEAD:${{ github.ref }} || true
          fi
          echo "### Your Permanent APK Signing Info" >> $GITHUB_STEP_SUMMARY
          echo "**Package Name:** \`com.drivezip.downloader\`" >> $GITHUB_STEP_SUMMARY
          SHA1=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -i "SHA1:" | awk '{print $2}')
          echo "**Permanent SHA-1 Fingerprint:** \`$SHA1\`" >> $GITHUB_STEP_SUMMARY

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          
      - name: Restore Permanent Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f keystore.b64 ]; then
            base64 -d keystore.b64 > ~/.android/debug.keystore
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveZip-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
